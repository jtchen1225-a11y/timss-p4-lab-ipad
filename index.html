<!DOCTYPE html>
<html lang="zh-Hant-MO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>聖若瑟教區中學第五校中文部小四思維課「數學小實驗」</title>
  <meta name="description" content="聖若瑟教區中學第五校中文部小四思維課「數學小實驗」（TIMSS Lab）互動操作教學平台。">
  <!-- 樣式庫 -->
  <link rel="stylesheet" href="css/ipad-layout.css">
  <link rel="stylesheet" href="css/lab-manipulatives.css">
  <link rel="stylesheet" href="css/floating-toolbar.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📱</text></svg>">
</head>
<body>

  <!-- 頂部導航列 -->
  <header class="ipad-header">
    <div class="top-bar-row">
      <div class="header-brand-center">
        <span class="brand-badge">📱</span>
        <h1>聖若瑟教區中學第五校中文部小四思維課<span class="title-highlight">「數學小實驗」</span></h1>
      </div>

      <div class="header-right-action">
        <button class="btn-teacher-panel" id="btn-open-teacher-modal" title="教師課堂實驗開放管理 (PIN: 8888)">
          ⚙️ 課堂進度控制
        </button>
      </div>
    </div>

    <!-- 11 週實驗滑動切換列 -->
    <nav class="week-nav-bar" id="week-nav-bar"></nav>
  </header>

  <!-- iPad 主內容區 -->
  <main class="ipad-stage-wrapper">
    <!-- 實驗標題與核心問題卡 -->
    <section class="lab-info-banner" id="lab-title-box"></section>

    <!-- 核心動手操作大舞台 (佔比 80%+) -->
    <section class="main-stage-card" id="main-stage-container"></section>

    <!-- 🎓 教師最後的總結（預設摺合） -->
    <section class="teacher-summary-card">
      <div class="summary-toggle-header" id="summary-toggle-btn">
        <div class="summary-title-area">
          <span class="summary-icon">🎓</span>
          <h3>教師最後的總結</h3>
          <span class="summary-badge">課堂提煉 ｜ 算式抽象</span>
        </div>
        <div class="summary-arrow-indicator" id="summary-arrow">
          <span id="summary-arrow-text">點擊展開總結</span>
          <span class="arrow-icon" id="summary-arrow-icon">▼</span>
        </div>
      </div>
      
      <!-- 總結內容區（預設隱藏/摺合） -->
      <div class="summary-body-collapse" id="summary-collapse-content" style="display: none;">
        <div class="summary-grid">
          <div class="summary-point-box" id="summary-core-point">
            <!-- 核心概念總結 -->
          </div>
          <div class="summary-point-box" id="summary-formula-point">
            <!-- 核心算式/定理 -->
          </div>
        </div>
        <div class="summary-quote-box" id="summary-quote-text">
          <!-- 總結金句/口訣 -->
        </div>
      </div>
    </section>
  </main>

  <!-- 獨立懸浮課堂工具箱 (畫筆/雷射筆/退出) -->
  <div class="floating-toolbox">
    <!-- 畫筆開啟時展開的子工具列 -->
    <div class="pen-sub-toolbar" id="pen-sub-menu">
      <button class="btn-exit-pen" id="btn-exit-pen">❌ 退出畫筆</button>
      <div class="color-dot" data-color="#ef4444" style="background:#ef4444;" title="紅色"></div>
      <div class="color-dot" data-color="#2563eb" style="background:#2563eb;" title="藍色"></div>
      <div class="color-dot" data-color="#f59e0b" style="background:#f59e0b;" title="黃色"></div>
      <div class="color-dot" data-color="#10b981" style="background:#10b981;" title="綠色"></div>
      <button class="tool-icon-btn" id="btn-eraser-pen" style="width:34px; height:34px; font-size:0.9rem;" title="橡皮擦">🧽</button>
      <button class="tool-icon-btn" id="btn-clear-pen" style="width:34px; height:34px; font-size:0.9rem;" title="清除全屏筆跡">🗑️</button>
    </div>

    <!-- 主懸浮按鈕條 -->
    <div class="toolbox-main-bar">
      <button class="tool-icon-btn" id="btn-toggle-pen" title="開啟/關閉黑板批註畫筆">✏️</button>
      <button class="tool-icon-btn" id="btn-toggle-laser" title="雷射筆紅光指引">🔴</button>
      <button class="tool-icon-btn" id="btn-toggle-sound" title="切換實驗音效">🔊</button>
      <button class="tool-icon-btn" id="btn-toggle-fs" title="全螢幕">⛶</button>
    </div>
  </div>

  <!-- 白板透明塗鴉層 (畫筆開啟時才攔截事件，關閉時 pointer-events: none 完全穿透) -->
  <canvas id="whiteboard-canvas"></canvas>

  <!-- 雷射筆光斑 -->
  <div id="laser-dot"></div>

  <!-- 🔐 教師 PIN 密碼驗證彈窗 -->
  <div class="modal-backdrop" id="teacher-pin-modal" style="display: none;">
    <div class="modal-card modal-pin-card">
      <div class="modal-header">
        <h3>🔐 教師課堂管理身分驗證</h3>
        <button class="modal-close-btn" id="btn-close-pin-modal">✖</button>
      </div>
      <div class="modal-body">
        <p style="color:#64748b; font-size:0.9rem; margin-bottom:12px;">
          請輸入教師管理密碼進入實驗開放設定（預設：<strong>8888</strong>）：
        </p>
        <div style="display:flex; gap:10px; justify-content:center; margin-bottom:12px;">
          <input type="password" id="input-teacher-pin" maxlength="6" placeholder="輸入 PIN" class="pin-input">
          <button class="touch-btn primary" id="btn-submit-pin" style="min-height:44px; padding:0 20px;">進入 ➔</button>
        </div>
        <div id="pin-error-msg" style="color:#ef4444; font-size:0.85rem; font-weight:bold; display:none; text-align:center;">
          ❌ PIN 碼錯誤，請重新輸入（預設 8888）
        </div>
      </div>
    </div>
  </div>

  <!-- ⚙️ 教師課堂實驗開放管理控制台 -->
  <div class="modal-backdrop" id="teacher-manage-modal" style="display: none;">
    <div class="modal-card modal-manage-card">
      <div class="modal-header">
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="font-size:1.3rem;">⚙️</span>
          <div>
            <h3>課堂實驗開放進度控制</h3>
            <span style="font-size:0.75rem; color:#64748b;">按教學進度手動開放 ｜ 建議每週開放 1~2 個實驗</span>
          </div>
        </div>
        <button class="modal-close-btn" id="btn-close-manage-modal">✖</button>
      </div>

      <div class="modal-body" style="max-height: 70vh; overflow-y: auto;">
        <!-- 快捷進度切換列 -->
        <div class="manage-presets-bar">
          <span style="font-weight:bold; font-size:0.85rem; color:#475569;">🚀 快速進度切換：</span>
          <div class="preset-btn-group">
            <button class="preset-pill" data-weeks="W01,W02">第 1、2 週</button>
            <button class="preset-pill" data-weeks="W03,W04">第 3、4 週</button>
            <button class="preset-pill" data-weeks="W05,W06">第 5、6 週</button>
            <button class="preset-pill" data-weeks="W07,W08">第 7、8 週</button>
            <button class="preset-pill" data-weeks="W09,W10">第 9、10 週</button>
            <button class="preset-pill" data-weeks="W11">第 11 週</button>
            <button class="preset-pill all-open" data-weeks="all">全部解鎖 (備課)</button>
          </div>
        </div>

        <!-- 11 週勾選清單 -->
        <div class="labs-checklist-container" id="labs-checklist-area">
          <!-- 由 JS 動態生成 11 週實驗核取方塊 -->
        </div>

        <!-- 當前狀態提示 -->
        <div class="manage-status-bar">
          <div>
            已選中 <strong id="selected-labs-count" style="color:#2563eb; font-size:1.1rem;">2</strong> 個實驗 
            <span id="selected-warning-hint" style="color:#d97706; font-size:0.85rem; margin-left:6px; display:none;">⚠️ 建議每週最多開放 2 個</span>
          </div>
          <div style="font-size:0.8rem; color:#64748b;">
            未勾選的實驗將對學生顯示 🔒 鎖定狀態
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="touch-btn" id="btn-copy-student-url">📋 複製學生網址</button>
          <button class="touch-btn" id="btn-show-qr-code">📱 大螢幕 QR 碼</button>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="touch-btn" id="btn-cancel-manage">取消</button>
          <button class="touch-btn primary" id="btn-save-manage">💾 儲存並在當前生效</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 📱 大螢幕 QR Code 投影彈窗 -->
  <div class="modal-backdrop" id="qrcode-modal" style="display: none;">
    <div class="modal-card modal-qr-card">
      <div class="modal-header">
        <h3>📱 學生 iPad 掃碼同步進度</h3>
        <button class="modal-close-btn" id="btn-close-qr-modal">✖</button>
      </div>
      <div class="modal-body" style="text-align:center; padding:18px 10px;">
        <p style="font-size:0.95rem; color:#334155; margin-bottom:12px;">
          請讓學生使用 iPad 相機掃描以下二維碼，自動進入當週開放實驗：
        </p>
        <div id="qrcode-img-box" style="display:flex; justify-content:center; margin-bottom:12px;">
          <!-- 動態載入 QR Code -->
        </div>
        <div class="qr-target-url-box" id="qr-target-url-text"></div>
        <div style="margin-top:14px;">
          <button class="touch-btn primary" id="btn-copy-qr-url">📋 複製此網址</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 腳本庫 -->
  <script src="js/config.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/pen-tool.js"></script>
  <script src="js/labs/lab01.js"></script>
  <script src="js/labs/lab02.js"></script>
  <script src="js/labs/lab03.js"></script>
  <script src="js/labs/lab04.js"></script>
  <script src="js/labs/lab05.js"></script>
  <script src="js/labs/lab06.js"></script>
  <script src="js/labs/lab07.js"></script>
  <script src="js/labs/lab08.js"></script>
  <script src="js/labs/lab09.js"></script>
  <script src="js/labs/lab10.js"></script>
  <script src="js/labs/lab11.js"></script>
  <script src="js/app-ipad.js"></script>
</body>
</html>
